plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}
}

loom {
	accessWidenerPath = file('src/main/resources/smarttrade.accesswidener')
	splitEnvironmentSourceSets()

	mods {
		"smarttrade" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "maven.modrinth:modmenu:${project.modmenu_version}"
	compileOnly "maven.modrinth:jade:${project.jade_version}"
}

def resolvedModVersion = version

processResources {
	inputs.property "version", resolvedModVersion
	filesMatching("fabric.mod.json") {
		expand "version": resolvedModVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('sourcesJar') {
	destinationDirectory = layout.buildDirectory.dir('devlibs')
}

sourceSets {
	bulkSaleTest {
		compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
		runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
	}
}

tasks.register('bulkSaleRegression', JavaExec) {
	dependsOn tasks.named('bulkSaleTestClasses')
	classpath = sourceSets.bulkSaleTest.runtimeClasspath
	mainClass = 'br.com.smarttrade.gameplay.BulkSalePlanTest'
	workingDir = layout.buildDirectory.dir('bulk-sale-test').get().asFile
	doFirst { workingDir.mkdirs() }
}

tasks.named('check') {
	dependsOn tasks.named('bulkSaleRegression')
}
